# Sirve la página web y manda /api/... al backend (así el navegador habla con un solo origen).
server {
    listen 80;
    server_name _;
    client_max_body_size 210m;          # zips de hasta 200 MB (el backend también lo limita)

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;        # un zip grande puede tardar
        proxy_send_timeout 600s;
    }
}
